# Runs the contract tests and the Solana pricing tests on every change.
name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx hardhat test
      - name: The committed web/contracts.js matches the contracts
        run: |
          node scripts/export-web.js
          git diff --exit-code web/contracts.js

  solana-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test -p jisr-math --release
        working-directory: solana
