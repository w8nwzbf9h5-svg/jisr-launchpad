# Builds the Solana program for deployment and runs its tests.
# The built program (jisr.so) and its interface file (jisr.json) are attached to the run as "jisr-solana-program".
name: Solana program

on:
  push:
    branches: [main]
    paths: ["solana/**", "web/solana/**", "scripts/solana-deploy.sh", "scripts/solana-start.js", ".github/workflows/solana.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: solana-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          # built from the published source on crates.io; kept by the cache step above for later runs
          if [ "$(anchor --version 2>/dev/null)" != "anchor-cli 0.31.1" ]; then cargo install anchor-cli --version 0.31.1 --locked; fi
      - name: Versions
        run: solana --version && anchor --version && cargo --version
      - name: Build the program
        working-directory: solana
        run: |
          anchor build
          ls -la target/deploy/jisr.so target/idl/jisr.json
      - name: Program tests
        working-directory: solana
        run: cargo test -p jisr --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client and page tests against a local Solana node
        run: |
          # the same client file and page the site serves, driving the program just built
          PROGRAM_ID=$(grep -oP 'declare_id!\("\K[^"]+' solana/programs/jisr/src/lib.rs)
          fresh_node() {
            pkill -f solana-test-validator || true
            sleep 3
            solana-test-validator --reset --quiet --ledger /tmp/jisr-ledger --bpf-program "$PROGRAM_ID" solana/target/deploy/jisr.so > /tmp/validator.log 2>&1 &
          }
          npm install --no-save --no-package-lock --no-audit --no-fund @solana/web3.js@1
          fresh_node
          PROGRAM_ID="$PROGRAM_ID" node solana/client-test/run.js || { echo "--- node log ---"; tail -40 /tmp/validator.log; exit 1; }
          fresh_node
          PROGRAM_ID="$PROGRAM_ID" node solana/client-test/page.js || { echo "--- node log ---"; tail -40 /tmp/validator.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: jisr-solana-program
          path: |
            solana/target/deploy/jisr.so
            solana/target/idl/jisr.json
          if-no-files-found: error
      - name: Rehearse the real-network deployment against a local node
        run: |
          # The same script the real deployment uses: deploy, start, hand the admin role on, make final.
          # It needs the program built for an address whose key we hold, so build again for new ones:
          # one for the normal case, one for the case where a stranger starts the program first.
          mkdir -p /tmp/rehearsal
          cd solana
          for n in 1 2; do
            solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/jisr-keypair.json
            anchor keys sync
            anchor build
            cp target/deploy/jisr-keypair.json "/tmp/rehearsal/key$n.json"
            cp target/deploy/jisr.so "/tmp/rehearsal/jisr$n.so"
          done
          cd ..
          pkill -f solana-test-validator || true
          sleep 3
          solana-test-validator --reset --quiet --ledger /tmp/jisr-ledger > /tmp/validator.log 2>&1 &
          PROGRAM_KEY=/tmp/rehearsal/key1.json PROGRAM_SO=/tmp/rehearsal/jisr1.so PROGRAM_KEY_2=/tmp/rehearsal/key2.json PROGRAM_SO_2=/tmp/rehearsal/jisr2.so \
            node solana/client-test/rehearsal.js || { echo "--- node log ---"; tail -40 /tmp/validator.log; exit 1; }
          rm -rf /tmp/rehearsal solana/target/deploy/jisr-keypair.json
