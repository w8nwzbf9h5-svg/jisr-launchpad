# Builds the Solana program for deployment and runs its tests.
# The built program (jisr.so) and its interface file (jisr.json) are attached to the run as "jisr-solana-program".
name: Solana program

on:
  push:
    branches: [main]
    paths: ["solana/**", "web/solana/**", ".github/workflows/solana.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: solana-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          # built from the published source on crates.io; kept by the cache step above for later runs
          if [ "$(anchor --version 2>/dev/null)" != "anchor-cli 0.31.1" ]; then cargo install anchor-cli --version 0.31.1 --locked; fi
      - name: Versions
        run: solana --version && anchor --version && cargo --version
      - name: Build the program
        working-directory: solana
        run: |
          anchor build
          ls -la target/deploy/jisr.so target/idl/jisr.json
      - name: Program tests
        working-directory: solana
        run: cargo test -p jisr --release
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Client test against a local Solana node
        run: |
          # the same client file the web page uses, driving the program just built
          PROGRAM_ID=$(grep -oP 'declare_id!\("\K[^"]+' solana/programs/jisr/src/lib.rs)
          solana-test-validator --reset --quiet --ledger /tmp/jisr-ledger --bpf-program "$PROGRAM_ID" solana/target/deploy/jisr.so > /tmp/validator.log 2>&1 &
          npm install --no-save --no-package-lock --no-audit --no-fund @solana/web3.js@1
          PROGRAM_ID="$PROGRAM_ID" node solana/client-test/run.js || { echo "--- node log ---"; tail -40 /tmp/validator.log; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: jisr-solana-program
          path: |
            solana/target/deploy/jisr.so
            solana/target/idl/jisr.json
          if-no-files-found: error
