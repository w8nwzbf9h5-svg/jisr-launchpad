# Deploys the Solana program to the REAL Solana network. Real money.
#
# It never runs by itself. Somebody with write access to this repository has to start it from the
# Actions tab and type the confirmation sentence. It changes nothing in the repository.
#
# Before the first run, add these under Settings > Secrets and variables > Actions:
#   SOLANA_MAINNET_DEPLOYER   the private key of a NEW wallet made only for this deployment, holding
#                             about 5.2 SOL. Either 64 numbers in square brackets, or the word Phantom
#                             shows under "Export private key". Do not use a wallet that holds anything else.
#   SOLANA_MAINNET_RPC        optional: the address of your own Solana RPC provider. Without it the
#                             public endpoint is used, which is slow and may refuse a deployment.
#
# What the job does (scripts/solana-deploy.sh, rehearsed against a local node on every change):
#   1. builds the program for a new address and runs its tests;
#   2. deploys it, still changeable;
#   3. starts it: records the stablecoin and the platform wallet, and reads the settings back;
#   4. names the admin wallet. That wallet takes over when it accepts on the Solana page;
#   5. removes the upgrade authority. From then on nobody can change the program, ever.
# If step 3 does not read back exactly our settings, the program is taken down, its SOL returns to the
# deployer wallet, and nothing is made final.
#
# About 2.5 SOL stays with the program for good (rent). The rest returns to the deployer wallet.
# After the admin wallet has accepted, the deployer key has no power left: empty that wallet and delete the secret.
name: Deploy Solana program to MAINNET (real money)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type exactly: deploy to mainnet'
        required: true
      admin_wallet:
        description: "Admin wallet (yours). It can change the platform wallet and nothing else."
        required: true
      platform_wallet:
        description: "Platform wallet. It receives the launchpad's 2% fee."
        required: true
      stable_mint:
        description: "Stablecoin mint. The default is USDC on Solana."
        required: true
        default: "EPjFWdd5AufqSSqeM2qN1xzybapC8G4wEGGkZwyTDt1v"
      priority:
        description: "Extra fee in micro-lamports per compute unit (0 for none)"
        required: true
        default: "20000"

permissions:
  contents: read

concurrency:
  group: solana-mainnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: solana-mainnet
    env:
      RPC_URL: ${{ secrets.SOLANA_MAINNET_RPC || 'https://api.mainnet-beta.solana.com' }}
      ADMIN_WALLET: ${{ inputs.admin_wallet }}
      PLATFORM_WALLET: ${{ inputs.platform_wallet }}
      STABLE_MINT: ${{ inputs.stable_mint }}
      PRIORITY: ${{ inputs.priority }}
      CONFIRM: ${{ inputs.confirm }}
    steps:
      - name: Confirmation
        run: |
          if [ "$CONFIRM" != "deploy to mainnet" ]; then echo "::error::The confirmation sentence was not typed exactly. Nothing was done."; exit 1; fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run this from the main branch."; exit 1; fi
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: solana-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          if [ "$(anchor --version 2>/dev/null)" != "anchor-cli 0.31.1" ]; then cargo install anchor-cli --version 0.31.1 --locked; fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployer wallet and a new program address
        env:
          SOLANA_KEY: ${{ secrets.SOLANA_MAINNET_DEPLOYER }}
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund @solana/web3.js@1
          if [ -z "$SOLANA_KEY" ]; then echo "::error::The secret SOLANA_MAINNET_DEPLOYER is not set. See the top of this workflow file."; exit 1; fi
          echo "DEPLOYER=$(node scripts/solana-key-file.js /tmp/deployer.json)" >> "$GITHUB_ENV"
          cd solana
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/jisr-keypair.json
          anchor keys sync
          echo "PROGRAM_ID=$(solana address -k target/deploy/jisr-keypair.json)" >> "$GITHUB_ENV"
      - name: Build the program for this address and run its tests
        working-directory: solana
        run: |
          anchor build
          test "$(grep -oP 'declare_id!\("\K[^"]+' programs/jisr/src/lib.rs)" = "$PROGRAM_ID"
          cargo test -p jisr --release
          ls -la target/deploy/jisr.so
      - name: Check the deployer wallet holds enough SOL
        run: |
          # the program's rent twice (once for good, once held during the upload and returned) plus 0.05 SOL for fees
          need=$(node -e 'const web3=require("@solana/web3.js"),fs=require("fs");new web3.Connection(process.env.RPC_URL).getMinimumBalanceForRentExemption(fs.statSync(process.argv[1]).size+45).then((r)=>console.log(2*r+50000000))' solana/target/deploy/jisr.so)
          bal=$(solana balance "$DEPLOYER" -u "$RPC_URL" --lamports | awk '{print $1}')
          echo "Deployer $DEPLOYER holds ${bal:-0} lamports; the deployment needs $need."
          if [ "${bal:-0}" -lt "$need" ]; then
            echo "::error::The deployer wallet $DEPLOYER holds ${bal:-0} lamports and needs $need. Send it the difference in SOL and run this again. Nothing was deployed."
            exit 1
          fi
      - name: Deploy, start, hand the admin role on, make final
        run: |
          DEPLOYER_KEY=/tmp/deployer.json PROGRAM_KEY="$PWD/solana/target/deploy/jisr-keypair.json" PROGRAM_SO="$PWD/solana/target/deploy/jisr.so" bash scripts/solana-deploy.sh
      - name: Report
        if: success()
        run: |
          mkdir -p /tmp/out
          echo "$PROGRAM_ID" > /tmp/out/program-id.txt
          cp solana/target/idl/jisr.json solana/programs/jisr/src/lib.rs solana/Anchor.toml solana/target/deploy/jisr.so /tmp/out/
          git rev-parse HEAD > /tmp/out/commit.txt
          {
            echo "### Jisr is deployed on Solana (real network)"
            echo ""
            echo "Program address: \`$PROGRAM_ID\`"
            echo ""
            echo "- It is final: it has no upgrade authority and cannot be changed."
            echo "- Stablecoin: \`$STABLE_MINT\`. Platform wallet: \`$PLATFORM_WALLET\`."
            echo "- Next: open the Solana page with the admin wallet \`$ADMIN_WALLET\` and press **Accept the admin role**."
            echo "- Then empty the deployer wallet \`$DEPLOYER\` and delete the secret SOLANA_MAINNET_DEPLOYER."
            echo "- Put the program address in \`web/solana/config.js\` (mainnet.programId) to switch the page on."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JISR_PROGRAM_ID=$PROGRAM_ID"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jisr-mainnet-deployment
          path: /tmp/out
      - name: Remove the keys
        if: always()
        run: rm -f /tmp/deployer.json solana/target/deploy/jisr-keypair.json
