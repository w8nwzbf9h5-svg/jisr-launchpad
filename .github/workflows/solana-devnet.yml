# Deploys the Solana program to devnet (the public test network). Test money only.
#
#   - The deployment is paid from the devnet deployer address (scripts/devnet-deployer.js). Its key is
#     public on purpose and used on devnet only, so anyone can fund it with free devnet SOL from
#     https://faucet.solana.com and no secret has to be stored anywhere.
#   - The job makes a new program address, builds the program for it and deploys it as final:
#     nobody can change the program afterwards, including whoever knows the deployer key.
#   - The program's address is printed in the run summary and attached as "jisr-devnet-deployment".
#     This job changes nothing in the repository.
# Start it by changing solana/deploy-devnet.txt, or from the Actions tab.
name: Deploy Solana program to devnet

on:
  push:
    branches: [main]
    paths: ["solana/deploy-devnet.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-devnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: solana-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          if [ "$(anchor --version 2>/dev/null)" != "anchor-cli 0.31.1" ]; then cargo install anchor-cli --version 0.31.1 --locked; fi
      - name: Deployer address and a new program address
        working-directory: solana
        run: |
          mkdir -p target/deploy
          echo "DEPLOYER=$(node ../scripts/devnet-deployer.js /tmp/deployer.json)" >> "$GITHUB_ENV"
          solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/jisr-keypair.json
          anchor keys sync
          echo "PROGRAM_ID=$(solana address -k target/deploy/jisr-keypair.json)" >> "$GITHUB_ENV"
          grep -n "declare_id" programs/jisr/src/lib.rs
      - name: Build the program for this address
        working-directory: solana
        run: |
          anchor build
          ls -la target/deploy/jisr.so
          test "$(grep -oP 'declare_id!\("\K[^"]+' programs/jisr/src/lib.rs)" = "$PROGRAM_ID"
      - name: Check the deployer has enough devnet SOL
        run: |
          # about 2.44 SOL of rent stays with the program for good; the same again is held during the upload and returned
          need=4950000000
          bal=$(solana balance "$DEPLOYER" -u devnet --lamports | awk '{print $1}')
          echo "Deployer $DEPLOYER holds ${bal:-0} lamports; the deployment needs $need."
          if [ "${bal:-0}" -lt "$need" ]; then
            # the public faucet usually refuses requests from shared machines, but it costs nothing to ask once
            solana airdrop 2 "$DEPLOYER" -u devnet || true
            sleep 20
            bal=$(solana balance "$DEPLOYER" -u devnet --lamports | awk '{print $1}')
          fi
          if [ "${bal:-0}" -lt "$need" ]; then
            echo "::error::The deployer address $DEPLOYER holds ${bal:-0} lamports and needs $need (4.95 SOL). Fund it at https://faucet.solana.com (devnet), then run this again."
            exit 1
          fi
      - name: Deploy, final
        working-directory: solana
        run: |
          solana program deploy target/deploy/jisr.so --program-id target/deploy/jisr-keypair.json -k /tmp/deployer.json -u devnet --final --max-sign-attempts 60
          # (showing the program needs a key file to be named too, even though it signs nothing)
          solana program show "$PROGRAM_ID" -u devnet -k /tmp/deployer.json || true
      - name: Report
        if: success()
        run: |
          mkdir -p /tmp/out
          echo "$PROGRAM_ID" > /tmp/out/program-id.txt
          cp solana/target/idl/jisr.json /tmp/out/jisr.json
          cp solana/programs/jisr/src/lib.rs /tmp/out/lib.rs
          cp solana/Anchor.toml /tmp/out/Anchor.toml
          {
            echo "### Jisr is deployed on Solana devnet"
            echo ""
            echo "Program address: \`$PROGRAM_ID\`"
            echo ""
            echo "Deployed as final: it cannot be upgraded or changed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JISR_PROGRAM_ID=$PROGRAM_ID"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jisr-devnet-deployment
          path: /tmp/out
      - name: Remove the keys
        if: always()
        run: rm -f /tmp/deployer.json solana/target/deploy/jisr-keypair.json
