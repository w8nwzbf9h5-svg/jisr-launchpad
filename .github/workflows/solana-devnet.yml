# Deploys the Solana program to devnet (the public test network). Test money only.
#
# How it works, and why nobody has to hold a key:
#   - the job makes a new deployer key and a new program address for itself and throws both away when it ends;
#   - it asks devnet's public faucet for the SOL the deployment needs;
#   - it deploys the program as final, so nobody can ever change it, including whoever held those keys.
# The program's address is printed in the run summary and attached as "jisr-devnet-deployment".
# Start it by changing solana/deploy-devnet.txt, or from the Actions tab.
name: Deploy Solana program to devnet

on:
  push:
    branches: [main]
    paths: ["solana/deploy-devnet.txt"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: solana-devnet-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/anchor
            ~/.cargo/registry
            ~/.cargo/git
            solana/target
          key: solana-${{ runner.os }}-${{ hashFiles('solana/Cargo.lock') }}
      - name: Install the Solana tools
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - name: Install Anchor
        run: |
          if [ "$(anchor --version 2>/dev/null)" != "anchor-cli 0.31.1" ]; then cargo install anchor-cli --version 0.31.1 --locked; fi
      - name: New deployer key and program address
        working-directory: solana
        run: |
          mkdir -p target/deploy
          solana-keygen new --no-bip39-passphrase --silent --force -o /tmp/deployer.json
          solana-keygen new --no-bip39-passphrase --silent --force -o target/deploy/jisr-keypair.json
          anchor keys sync
          echo "PROGRAM_ID=$(solana address -k target/deploy/jisr-keypair.json)" >> "$GITHUB_ENV"
          echo "DEPLOYER=$(solana address -k /tmp/deployer.json)" >> "$GITHUB_ENV"
          grep -n "declare_id" programs/jisr/src/lib.rs
      - name: Build the program for this address
        working-directory: solana
        run: |
          anchor build
          ls -la target/deploy/jisr.so
          test "$(grep -oP 'declare_id!\("\K[^"]+' programs/jisr/src/lib.rs)" = "$PROGRAM_ID"
      - name: Get devnet SOL from the public faucet
        run: |
          # the deployment needs about 5 SOL for a moment and keeps about 2.5 as the program's rent
          need=5200000000
          for i in $(seq 1 30); do
            bal=$(solana balance "$DEPLOYER" -u devnet --lamports | awk '{print $1}')
            echo "balance: $bal lamports"
            if [ "${bal:-0}" -ge "$need" ]; then break; fi
            solana airdrop 2 "$DEPLOYER" -u devnet || solana airdrop 1 "$DEPLOYER" -u devnet || true
            sleep 20
          done
          bal=$(solana balance "$DEPLOYER" -u devnet --lamports | awk '{print $1}')
          if [ "${bal:-0}" -lt "$need" ]; then echo "::error::The devnet faucet did not give enough SOL (have $bal lamports, need $need). Run this again later."; exit 1; fi
      - name: Deploy, final
        working-directory: solana
        run: |
          solana program deploy target/deploy/jisr.so --program-id target/deploy/jisr-keypair.json -k /tmp/deployer.json -u devnet --final --max-sign-attempts 60
          solana program show "$PROGRAM_ID" -u devnet
      - name: Report
        if: success()
        run: |
          mkdir -p /tmp/out
          echo "$PROGRAM_ID" > /tmp/out/program-id.txt
          cp solana/target/idl/jisr.json /tmp/out/jisr.json
          cp solana/programs/jisr/src/lib.rs /tmp/out/lib.rs
          cp solana/Anchor.toml /tmp/out/Anchor.toml
          {
            echo "### Jisr is deployed on Solana devnet"
            echo ""
            echo "Program address: \`$PROGRAM_ID\`"
            echo ""
            echo "Deployed as final: it cannot be upgraded or changed."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "JISR_PROGRAM_ID=$PROGRAM_ID"
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: jisr-devnet-deployment
          path: /tmp/out
      - name: Remove the keys
        if: always()
        run: rm -f /tmp/deployer.json solana/target/deploy/jisr-keypair.json
